<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TruthLens — Fake News Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#060a0f;--bg2:#0d1117;--surf:#151d28;--surf2:#1a2333;
      --b1:#1e2d3d;--b2:#253345;--tx:#e8edf2;--tx2:#8899aa;--tx3:#4a5a6a;
      --ac:#00d4ff;--gn:#00ff88;--rd:#ff3355;--or:#ff8844;--yl:#ffcc00;--pu:#a855f7;
      --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
      --px:clamp(1rem,4vw,2rem);--gap:clamp(0.6rem,2vw,1.2rem);--r:12px
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--fb);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6}
    button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
    input,textarea{font-family:var(--fb);outline:none;border:none}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
    .grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:var(--gap)}
    .grid-sidebar{display:grid;grid-template-columns:1fr 300px;gap:var(--gap)}
    @media(max-width:1024px){.grid-sidebar{grid-template-columns:1fr}}
    @media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,1fr)}.hide-md{display:none!important}}
    @media(max-width:480px){.grid-4{grid-template-columns:1fr}.hide-sm{display:none!important}}
    .wrap{max-width:1100px;margin:0 auto;padding:0 var(--px)}
    .card{background:var(--surf);border:1px solid var(--b1);border-radius:var(--r);padding:clamp(1rem,3vw,1.6rem)}
    .h1{font-family:var(--fh);font-weight:800;font-size:clamp(2rem,5vw,3.8rem);letter-spacing:-.03em;line-height:1.05}
    .h2{font-family:var(--fh);font-weight:800;font-size:clamp(1.5rem,3.5vw,2.4rem);letter-spacing:-.03em}
    .h3{font-family:var(--fh);font-weight:700;font-size:clamp(1rem,2vw,1.1rem)}
    .label{font-family:var(--fm);font-size:11px;letter-spacing:.15em;color:var(--tx3);text-transform:uppercase}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinR{to{transform:rotate(-360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes slideIn{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
    #navbar{position:fixed;top:0;left:0;right:0;z-index:200;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
    #navbar.scrolled{background:rgba(6,10,15,.95);backdrop-filter:blur(20px);border-bottom-color:var(--b1)}
    .nav-inner{max-width:1100px;margin:0 auto;padding:0 var(--px);display:flex;align-items:center;justify-content:space-between;height:64px;gap:1rem}
    .nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .logo-box{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--gn));display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:800;font-size:14px;color:#000}
    .logo-text{font-family:var(--fh);font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
    .nav-links{display:flex;align-items:center;gap:2px}
    .nav-btn{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--tx2);transition:all .2s;white-space:nowrap}
    .nav-btn:hover{color:var(--tx)}
    .nav-btn.active{color:var(--ac);background:rgba(0,212,255,.08);font-weight:600}
    .nav-cta{padding:8px 16px;border-radius:8px;background:var(--ac);color:#000!important;font-family:var(--fh);font-weight:700;font-size:13px;margin-left:8px}
    .hamburger{display:none;flex-direction:column;gap:5px;padding:8px}
    .hamburger span{display:block;width:22px;height:2px;background:var(--tx);border-radius:2px;transition:all .3s}
    .mob-menu{display:none;flex-direction:column;gap:2px;padding:.8rem var(--px) 1.2rem;background:var(--bg2);border-top:1px solid var(--b1)}
    .mob-menu.open{display:flex}
    .mob-btn{padding:10px 12px;border-radius:8px;font-size:14px;text-align:left;color:var(--tx2)}
    .mob-btn.active{color:var(--ac);background:rgba(0,212,255,.08)}
    @media(max-width:768px){.nav-links{display:none}.hamburger{display:flex}}
    .hero{min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(64px + 3rem) var(--px) 3rem;position:relative;overflow:hidden}
    .hero-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.04)1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.04)1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%)}
    .hero-orb{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:min(500px,90vw);height:min(500px,90vw);border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.07) 0%,transparent 70%);pointer-events:none}
    .hero-content{position:relative;max-width:min(760px,100%);animation:fadeUp .8s ease}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.22);border-radius:20px;padding:5px 14px;margin-bottom:1.4rem;font-family:var(--fm);font-size:11px;color:var(--ac);letter-spacing:.1em}
    .hero-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--gn);animation:pulse 2s infinite}
    .hero-sub{font-size:clamp(.95rem,2vw,1.1rem);color:var(--tx2);max-width:520px;margin:0 auto 1.4rem;line-height:1.75}
    .hero-ticker{height:24px;overflow:hidden;margin-bottom:2rem;font-family:var(--fm);font-size:12px;color:var(--tx3)}
    .stats-strip{background:var(--surf);border-top:1px solid var(--b1);border-bottom:1px solid var(--b1);padding:1.8rem var(--px)}
    .stats-strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);text-align:center}
    @media(max-width:600px){.stats-strip .wrap{grid-template-columns:repeat(2,1fr)}}
    .stat-val{font-family:var(--fh);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);color:var(--ac);letter-spacing:-.03em}
    .stat-lbl{font-size:11px;color:var(--tx3);font-family:var(--fm);letter-spacing:.06em;margin-top:4px}
    .feat-card{background:var(--surf);border:1px solid var(--b1);border-radius:var(--r);padding:clamp(1.2rem,3vw,1.6rem);transition:transform .2s,border-color .2s}
    .feed-item{background:var(--bg2);border:1px solid var(--b1);border-radius:9px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;animation:slideIn .3s ease both}
    .cta-card{max-width:min(540px,100%);margin:0 auto;background:var(--surf);border:1px solid var(--b1);border-radius:20px;padding:clamp(2rem,5vw,3rem) clamp(1.5rem,4vw,2.5rem);text-align:center;position:relative;overflow:hidden}
    .cta-orb{position:absolute;top:-50px;right:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,136,.07) 0%,transparent 70%);pointer-events:none}
    .cta-btn{display:inline-block;padding:13px clamp(20px,4vw,30px);border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--gn));color:#000;font-family:var(--fh);font-weight:700;font-size:clamp(13px,2vw,15px);cursor:pointer;border:none}
    .page-wrap{padding:calc(64px + 2rem) var(--px) 4rem;max-width:1100px;margin:0 auto}
    .input-box{background:var(--surf);border:1px solid var(--b2);border-radius:13px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 40px rgba(0,212,255,.05);margin-bottom:1rem}
    .txt-input{background:none;color:var(--tx);font-size:14px;padding:8px;width:100%}
    .txt-input::placeholder{color:var(--tx3)}
    .analyze-btn{background:var(--ac);color:#000;font-family:var(--fh);font-weight:700;font-size:14px;padding:11px 24px;border-radius:9px;align-self:flex-end;border:none;cursor:pointer;transition:opacity .2s}
    .analyze-btn:disabled{opacity:.4;cursor:not-allowed}
    .sample-btn{font-size:11px;font-family:var(--fm);background:var(--surf);border:1px solid var(--b1);border-radius:6px;padding:5px 10px;color:var(--tx3);cursor:pointer;transition:all .15s}
    .sample-btn:hover{color:var(--ac);border-color:var(--ac)}
    .loader-card{background:var(--surf);border:1px solid var(--b1);border-radius:16px;padding:clamp(1.5rem,4vw,2.5rem);animation:fadeUp .3s ease}
    .spinner{position:relative;width:64px;height:64px;flex-shrink:0}
    .spin-outer{position:absolute;inset:0;border-radius:50%;border:2px solid var(--b2);border-top:2px solid var(--ac);animation:spin .9s linear infinite}
    .spin-inner{position:absolute;inset:8px;border-radius:50%;border:1px solid var(--b1);border-bottom:1px solid var(--gn);animation:spinR 1.4s linear infinite}
    .step-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
    .step-num{width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--fm)}
    .progress-bar{height:3px;background:var(--b1);border-radius:2px;overflow:hidden;margin-top:1.5rem}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--gn));border-radius:2px;transition:width .5s ease;box-shadow:0 0 10px var(--ac)}
    .verdict-card{background:var(--surf);border-radius:16px;padding:clamp(1.2rem,3vw,2rem);margin-bottom:var(--gap);position:relative;overflow:hidden}
    .verdict-val{font-family:var(--fh);font-weight:800;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.03em;line-height:1.1}
    .verdict-badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:4px 11px;border-radius:5px;font-family:var(--fm);font-size:10px;letter-spacing:.08em}
    .sig-bar{margin-bottom:1rem}
    .sig-bar-track{height:5px;background:var(--b1);border-radius:3px;overflow:hidden;margin-top:5px}
    .sig-bar-fill{height:100%;border-radius:3px;transition:width 1.3s cubic-bezier(.16,1,.3,1)}
    .meta-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b1);font-size:12px;gap:8px}
    .sig-tag{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:8px;font-size:13px;line-height:1.4}
    .sig-tags{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:8px}
    .ai-box{background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.18);border-radius:10px;padding:1rem 1.1rem;margin-top:1.2rem}
    .ai-header{display:flex;align-items:center;gap:8px;margin-bottom:9px}
    .ai-badge{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--ac),var(--gn));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#000}
    .ai-dot{width:5px;height:5px;border-radius:50%;background:var(--ac)}
    .hist-item{display:flex;align-items:center;justify-content:space-between;background:var(--surf);border:1px solid var(--b1);border-radius:9px;padding:9px 13px;cursor:pointer;transition:background .15s;gap:12px}
    .hist-item:hover{background:var(--surf2)}
    .chart-card{background:var(--surf);border:1px solid var(--b1);border-radius:14px;padding:clamp(1rem,3vw,1.5rem)}
    .bar-wrap{display:flex;align-items:flex-end;gap:6px;height:140px;padding:0 2px}
    .bar-grp{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
    .bars-inner{display:flex;gap:2px;align-items:flex-end;height:110px}
    .bar{border-radius:3px 3px 0 0;min-width:7px;flex:1}
    .bar:hover{opacity:.7}
    .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11px;font-family:var(--fm);color:var(--tx3)}
    .legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
    .flag-table{width:100%;border-collapse:collapse;font-size:12px;min-width:360px}
    .flag-th{text-align:left;padding:7px 10px;font-size:10px;color:var(--tx3);font-family:var(--fm);letter-spacing:.08em;border-bottom:1px solid var(--b1)}
    .flag-td{padding:10px;border-bottom:1px solid var(--b1)}
    .flag-badge{font-size:9px;font-family:var(--fm);background:rgba(255,51,85,.1);color:var(--rd);border:1px solid rgba(255,51,85,.25);border-radius:4px;padding:3px 7px}
    .live-badge{display:flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--b1);border-radius:9px;padding:7px 13px;font-family:var(--fm);font-size:12px;color:var(--tx2)}
    .live-dot{width:6px;height:6px;border-radius:50%;background:var(--gn);animation:pulse 2s infinite}
    .team-card{background:var(--surf);border:1px solid var(--b1);border-radius:13px;padding:clamp(1rem,3vw,1.3rem);text-align:center;transition:transform .2s,border-color .2s}
    .avatar{width:50px;height:50px;border-radius:50%;margin:0 auto .9rem;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:800;font-size:14px}
    .tech-chip{font-size:11px;font-family:var(--fm);background:var(--bg2);border:1px solid var(--b2);border-radius:5px;padding:3px 9px;color:var(--tx2)}
    .tl-dot{position:absolute;left:-16px;top:5px;width:9px;height:9px;border-radius:50%}
    .phase-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:1.8rem}
    .phase-tab{padding:7px 13px;border-radius:7px;font-size:12px;font-family:var(--fm);transition:all .2s;cursor:pointer;border:none}
    .phase-detail{background:var(--surf);border-radius:18px;padding:clamp(1.5rem,4vw,2.5rem);margin-bottom:2.5rem;animation:fadeUp .3s ease}
    .check-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--b1)}
    .pipeline-scroll{display:flex;align-items:center;overflow-x:auto;padding:.5rem 0;scrollbar-width:none;gap:4px}
    .pipeline-scroll::-webkit-scrollbar{display:none}
    .pipeline-node{flex-shrink:0;width:clamp(90px,15vw,120px);background:var(--surf);border:1px solid var(--b1);border-radius:11px;padding:.8rem;text-align:center;cursor:pointer;transition:all .2s}
    .model-row{display:grid;grid-template-columns:1fr 80px 1fr;gap:1rem;padding:12px 0;border-bottom:1px solid var(--b1);align-items:center}
    .stat-card{background:var(--surf);border:1px solid var(--b1);border-radius:13px;padding:clamp(1.2rem,3vw,1.5rem);text-align:center}
    /* Offline banner */
    .offline-banner{background:rgba(255,136,68,.08);border:1px solid rgba(255,136,68,.3);border-radius:10px;padding:14px 16px;margin-bottom:1rem;font-size:13px;color:var(--or)}
    .offline-banner a{color:var(--ac);text-decoration:underline}
  </style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#4a5a6a;font-family:monospace;font-size:13px">Loading TruthLens...</div></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef}=React;

// ═══════════════════════════════════════════════════════════════════
// BERT API — Gradio 5 SSE protocol
// HuggingFace Spaces allow browser CORS for gradio_api endpoints
// ═══════════════════════════════════════════════════════════════════
const HF_SPACE = 'https://pankajkr07-fakenewsdetector.hf.space';
const API_ENDPOINT = HF_SPACE + '/call/predict';

async function callBERT(title, content, onStatus) {
  // Step 1: Wake up the Space
  onStatus('🔌 Waking HF Space...');
  try {
    await fetch(HF_SPACE + '/info', { method: 'GET', mode: 'cors' });
  } catch(e) {
    try { await fetch(HF_SPACE, { method: 'GET', mode: 'no-cors' }); } catch {}
  }
  await new Promise(r => setTimeout(r, 3000));

  // Step 2: POST to Gradio 5 API → get event_id
  onStatus('📡 Sending to BERT model...');
  let event_id;
  try {
    const postRes = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
      },
      body: JSON.stringify({ data: [title, content] })
    });
    if (!postRes.ok) {
      throw new Error(`POST failed: HTTP ${postRes.status}`);
    }
    const postData = await postRes.json();
    event_id = postData.event_id;
    if (!event_id) throw new Error('No event_id in response');
    console.log('✅ Got event_id:', event_id);
  } catch(e) {
    console.error('POST failed:', e.message);
    throw new Error('BERT_POST_FAILED: ' + e.message);
  }

  // Step 3: SSE stream → wait for 'complete' event
  onStatus('🧠 BERT running inference...');
  return new Promise((resolve, reject) => {
    const sseUrl = `${API_ENDPOINT}/${event_id}`;
    const evtSrc = new EventSource(sseUrl);
    const timer = setTimeout(() => {
      evtSrc.close();
      reject(new Error('BERT_TIMEOUT'));
    }, 60000);

    evtSrc.addEventListener('complete', (e) => {
      clearTimeout(timer); evtSrc.close();
      try {
        const parsed = JSON.parse(e.data);
        // parsed.data = [html_string, json_object]
        let jsonResult = parsed.data ? parsed.data[1] : null;
        if (typeof jsonResult === 'string') {
          try { jsonResult = JSON.parse(jsonResult); } catch {}
        }
        if (!jsonResult || jsonResult.real_probability === undefined) {
          reject(new Error('BERT_BAD_RESPONSE'));
        } else {
          console.log('✅ BERT result:', jsonResult);
          resolve(jsonResult);
        }
      } catch(err) { reject(new Error('BERT_PARSE_ERROR: ' + err.message)); }
    });

    evtSrc.addEventListener('error', (e) => {
      clearTimeout(timer); evtSrc.close();
      reject(new Error('BERT_SSE_ERROR'));
    });

    // Also handle 'process_completed' for older Gradio versions
    evtSrc.addEventListener('process_completed', (e) => {
      clearTimeout(timer); evtSrc.close();
      try {
        const parsed = JSON.parse(e.data);
        let jsonResult = parsed.output ? parsed.output.data[1] : null;
        if (typeof jsonResult === 'string') try { jsonResult = JSON.parse(jsonResult); } catch {}
        if (jsonResult && jsonResult.real_probability !== undefined) resolve(jsonResult);
        else reject(new Error('BERT_BAD_RESPONSE_V4'));
      } catch(err) { reject(new Error('BERT_PARSE_V4: ' + err.message)); }
    });
  });
}

// Build result from BERT JSON response
function buildResult(title, data) {
  const credibility = Math.round(data.real_probability * 100);
  let verdict, label, color;
  if (credibility >= 70) { verdict='Likely Real'; label='CREDIBLE'; color='#00ff88'; }
  else if (credibility >= 40) { verdict='Unverified'; label='UNCERTAIN'; color='#ffcc00'; }
  else if (credibility >= 25) { verdict='Suspicious'; label='SUSPICIOUS'; color='#ff8844'; }
  else { verdict='Likely Fake'; label='FAKE'; color='#ff3355'; }
  return {
    title: title||'Untitled', overall:credibility, verdict, label, color,
    isBERT: true,
    scores:{
      heuristic:{score:Math.round((1-data.heuristic_fake)*100),label:'Heuristic Engine',desc:data.heuristic_details||'No red flags'},
      bert:{score:Math.round(data.bert_real*100),label:'BERT Model',desc:'bert-base-uncased WELFake'},
      ensemble:{score:credibility,label:'Ensemble Score',desc:'BERT 85% + Heuristic 15%'}
    },
    signals:[
      data.bert_fake>0.5?{type:'negative',text:`BERT Fake: ${(data.bert_fake*100).toFixed(1)}%`}:{type:'positive',text:`BERT Real: ${(data.bert_real*100).toFixed(1)}%`},
      data.heuristic_fake>0?{type:'warning',text:'Heuristic: '+data.heuristic_details}:{type:'positive',text:'No heuristic red flags'}
    ],
    metadata:{
      'Model':'bert-base-uncased (WELFake)',
      'Confidence':data.confidence+'%',
      'BERT Fake':(data.bert_fake*100).toFixed(1)+'%',
      'BERT Real':(data.bert_real*100).toFixed(1)+'%',
      'Heuristic':(data.heuristic_fake*100).toFixed(1)+'%'
    }
  };
}

// ═══════════════════════════════════════════════════════════════════
// FALLBACK: Heuristic-only (when BERT API fails)
// Same logic as app.py heuristic_score()
// ═══════════════════════════════════════════════════════════════════
const CONSPIRACY_PHRASES=[
  "they don't want you to know","wake up","share before deleted","deep state","cover up",
  "mainstream media hiding","bombshell","whistleblower","classified document","microchip",
  "population control","new world order","government hiding","censored","banned video",
  "truth revealed","global conspiracy","secret underground","fake pandemic","5g tower",
  "poison water","depopulation","shadow government","false flag","staged attack",
  "crisis actor","illuminati","chemtrail","mind control","breaking news","shocking truth"
];
const FAKE_KW=['hoax','conspiracy','leaked','classified','bombshell','shocking','exposed',
  'they don\'t','hidden agenda','mainstream media','fake pandemic','crisis actor','deep state',
  'new world order','share before','banned','censored','wake up','illuminati','chemtrail',
  'microchip','depopulation','shadow government','false flag','staged','underground',
  'whistleblower','anonymous sources','insider reveals','government admits'];
const REAL_KW=['according to','reported by','confirmed','announced','official','government said',
  'spokesperson','data shows','research indicates','study finds','percent','million','billion',
  'policy','legislation','conference','the company','published','journal','source said',
  'officials said','statement','report','analysis','survey','committee','investigation'];

function heuristicFallback(title, content) {
  const text=`${title}. ${content}`.trim();
  const lower=text.toLowerCase();
  let hScore=0; const hDetails=[];
  const phrases=CONSPIRACY_PHRASES.filter(p=>lower.includes(p)).length;
  if(phrases>=3){hScore+=0.40;hDetails.push(`Conspiracy phrases: ${phrases}`);}
  else if(phrases>=1){hScore+=0.20;hDetails.push(`Conspiracy phrases: ${phrases}`);}
  const alpha=[...text].filter(c=>/[a-zA-Z]/.test(c));
  if(alpha.length){
    const caps=alpha.filter(c=>c===c.toUpperCase()).length/alpha.length;
    if(caps>0.4){hScore+=0.25;hDetails.push(`High caps: ${caps.toFixed(2)}`);}
    else if(caps>0.25){hScore+=0.10;hDetails.push(`Elevated caps: ${caps.toFixed(2)}`);}
  }
  const words=text.split(/\s+/);
  if(words.length){
    const excl=(text.match(/!/g)||[]).length/words.length;
    if(excl>0.1){hScore+=0.20;hDetails.push(`High exclamation: ${excl.toFixed(2)}`);}
    else if(excl>0.05){hScore+=0.10;hDetails.push(`Elevated exclamation: ${excl.toFixed(2)}`);}
  }
  hScore=Math.min(hScore,1.0);
  const fakeKw=FAKE_KW.filter(k=>lower.includes(k)).length;
  const realKw=REAL_KW.filter(k=>lower.includes(k)).length;
  const total=Math.max(fakeKw+realKw,1);
  let bertLike=fakeKw/total*0.8+(fakeKw>0?0.1:0);
  if(realKw>fakeKw*2)bertLike=Math.max(0.05,bertLike-0.3);
  if(fakeKw>realKw*2)bertLike=Math.min(0.95,bertLike+0.2);
  bertLike=Math.max(0.05,Math.min(0.95,bertLike));
  const combinedFake=bertLike*0.70+hScore*0.30;
  const credibility=Math.round((1-combinedFake)*100);
  let verdict,label,color;
  if(credibility>=70){verdict='Likely Real';label='CREDIBLE';color='#00ff88';}
  else if(credibility>=40){verdict='Unverified';label='UNCERTAIN';color='#ffcc00';}
  else if(credibility>=25){verdict='Suspicious';label='SUSPICIOUS';color='#ff8844';}
  else{verdict='Likely Fake';label='FAKE';color='#ff3355';}
  return{
    title:title||'Untitled',overall:credibility,verdict,label,color,isBERT:false,
    scores:{
      heuristic:{score:Math.round((1-hScore)*100),label:'Heuristic Engine',desc:hDetails.join('; ')||'No red flags'},
      bert:{score:Math.round((1-bertLike)*100),label:'Pattern Analysis',desc:'Fallback (BERT unavailable)'},
      ensemble:{score:credibility,label:'Combined Score',desc:'Pattern 70% + Heuristic 30%'}
    },
    signals:[
      bertLike>0.5?{type:'negative',text:`Pattern: Fake signals (${(bertLike*100).toFixed(1)}%)`}:{type:'positive',text:`Pattern: Real signals (${((1-bertLike)*100).toFixed(1)}%)`},
      hScore>0?{type:'warning',text:'Flags: '+hDetails.join('; ')}:{type:'positive',text:'No heuristic red flags'}
    ],
    metadata:{
      'Mode':'⚠️ Fallback (BERT offline)','Pattern Score':(bertLike*100).toFixed(1)+'% fake',
      'Heuristic Risk':(hScore*100).toFixed(1)+'%','Conspiracy Phrases':phrases+' found'
    }
  };
}

// ── Main analysis function ──────────────────────────────────────────
async function analyzeArticle(title, content, onStatus) {
  try {
    const bertData = await callBERT(title, content, onStatus);
    onStatus('✅ BERT analysis complete!');
    return buildResult(title, bertData);
  } catch(e) {
    console.warn('BERT failed, using fallback:', e.message);
    onStatus('⚠️ BERT unavailable — using heuristic fallback...');
    await new Promise(r=>setTimeout(r,800));
    return heuristicFallback(title, content);
  }
}

function ScoreRing({score,color}){
  const sz=120,r=sz/2-8,circ=2*Math.PI*r;
  const [cur,setCur]=useState(0);
  const offset=circ-(cur/100)*circ;
  useEffect(()=>{const t=setTimeout(()=>setCur(score),200);return()=>clearTimeout(t)},[score]);
  return(
    <div style={{position:'relative',width:sz,height:sz,flexShrink:0}}>
      <svg width={sz} height={sz} style={{transform:'rotate(-90deg)',position:'absolute',inset:0}}>
        <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke="var(--b2)" strokeWidth={7}/>
        <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={color} strokeWidth={7}
          strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
          style={{transition:'stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1)',filter:`drop-shadow(0 0 8px ${color}66)`}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>

        <div style={{fontSize:9,color:'var(--tx3)',fontFamily:'var(--fm)',marginTop:2}}>/100</div>
      </div>
    </div>
  );
}
